<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Parking Entrance & Management Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
        .display-board { background: #1e293b; border: 2px solid #38bdf8; border-radius: 16px; padding: 30px; }
        .slot-count { font-size: 5rem; font-weight: 900; color: #4ade80; }
        .card-custom { background: #1e293b; border: 1px solid #334155; border-radius: 12px; }
    </style>
</head>
<body class="p-4">
<div class="container">
    <div class="display-board text-center mb-4">
        <h2 class="text-uppercase tracking-wide text-info">Live Entrance Availability Display</h2>
        <div class="slot-count" id="slots-val">--</div>
        <div class="h4" id="status-val">LOADING SYSTEM...</div>
    </div>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="card card-custom p-4 text-white">
                <h4>Entry Lane Barrier</h4>
                <div class="mb-3">
                    <label>License Plate</label>
                    <input type="text" id="entry-plate" class="form-control" placeholder="e.g. KAA 123A">
                </div>
                <button onclick="handleEntry()" class="btn btn-success w-100">Record Entry & Open Gate</button>
                <div id="entry-res" class="mt-3"></div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card card-custom p-4 text-white">
                <h4>Exit Checkout & Barrier</h4>
                <div class="mb-3">
                    <label>License Plate</label>
                    <div class="input-group">
                        <input type="text" id="exit-plate" class="form-control" placeholder="e.g. KAA 123A">
                        <button onclick="calcExit()" class="btn btn-primary">Calculate Fee</button>
                    </div>
                </div>
                <div id="checkout-box" class="d-none bg-dark p-3 rounded mb-3">
                    <div>Gross Due: <strong id="fee-val" class="text-warning">0.00</strong> KES</div>
                    <div class="small text-muted">Includes 16% VAT</div>
                    <select id="pay-method" class="form-select my-2">
                        <option value="MPESA">M-Pesa</option>
                        <option value="CARD">Card</option>
                        <option value="CASH">Cash</option>
                    </select>
                    <button onclick="processPay()" class="btn btn-danger w-100">Confirm Payment & Open Exit Barrier</button>
                </div>
                <div id="exit-res"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const API = "http://127.0.0.1:8000/api";
    let activeSessionId = null;
    let activeAmount = 0;

    async function loadDisplay() {
        try {
            const res = await fetch(`${API}/display/live`);
            const data = await res.json();
            document.getElementById('slots-val').innerText = data.available_slots;
            document.getElementById('status-val').innerText = `STATUS: ${data.status}`;
        } catch(e) {}
    }

    async function handleEntry() {
        const plate = document.getElementById('entry-plate').value;
        const res = await fetch(`${API}/entry/record`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({plate_number: plate})
        });
        const data = await res.json();
        document.getElementById('entry-res').innerText = res.ok ? `Allocated: ${data.allocated_bay}` : data.detail;
        loadDisplay();
    }

    async function calcExit() {
        const plate = document.getElementById('exit-plate').value;
        const res = await fetch(`${API}/exit/calculate/${plate}`);
        const data = await res.json();
        if(res.ok) {
            activeSessionId = data.session_id;
            activeAmount = data.gross_payable;
            document.getElementById('fee-val').innerText = data.gross_payable;
            document.getElementById('checkout-box').classList.remove('d-none');
        }
    }

    async function processPay() {
        const method = document.getElementById('pay-method').value;
        const res = await fetch(`${API}/exit/pay`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                session_id: activeSessionId,
                payment_method: method,
                amount_paid: activeAmount
            })
        });
        const data = await res.json();
        document.getElementById('exit-res').innerText = res.ok ? data.message : data.detail;
        document.getElementById('checkout-box').classList.add('d-none');
        loadDisplay();
    }

    setInterval(loadDisplay, 3000);
    loadDisplay();
</script>
</body>
</html>
